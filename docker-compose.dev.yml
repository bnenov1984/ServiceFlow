# Development only (ADR-005: Docker is never a customer-machine dependency).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: serviceflow
    ports:
      - "5433:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-db:
