# CI budget: < 10 minutes (12_TESTING_STRATEGY par.4) — a slow suite stops being run.
name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serviceflow
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: serviceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviceflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SERVICEFLOW_TEST_DATABASE_URL: postgresql+psycopg://serviceflow:ci-password@localhost:5432/serviceflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      E2E_BASE_URL: https://serviceflow-frontend.onrender.com
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
