[project]
name = "serviceflow-backend"
version = "0.1.0"
description = "ServiceFlow (working name) - service management platform for repair businesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serviceflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["serviceflow"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "pillow_heif"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
